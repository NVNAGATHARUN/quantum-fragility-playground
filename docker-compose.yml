services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/data/quantum_lens.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before starting production}
      - INSTRUCTOR_INVITE_CODE=${INSTRUCTOR_INVITE_CODE:?Set INSTRUCTOR_INVITE_CODE before starting production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - QL_ALLOWED_ORIGINS=${QL_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
