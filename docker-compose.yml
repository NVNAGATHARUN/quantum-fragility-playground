version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///quantum_lens.db
      - JWT_SECRET_KEY=quantum-lens-ai-production-secret-key-sih2026-ps26140-super-secure-token-32b
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - db_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
